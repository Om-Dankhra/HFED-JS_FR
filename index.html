<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFED Energy Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.statcan.gc.ca/Framework/js/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/fr.js"></script>
</head>
<body>
    <div class="container">
        <div class="controls-row">
            <div class="control-group">
                <label for="province-select">Province/territoire</label>
                <select id="province-select">
                    <option value="Terre-Neuve">Terre-Neuve</option>
                    <option value="Île-du-Prince-Édouard">Île-du-Prince-Édouard</option>
                    <option value="Nouvelle-Écosse">Nouvelle-Écosse</option>
                    <option value="Nouveau-Brunswick">Nouveau-Brunswick</option>
                    <option value="Québec">Québec</option>
                    <option value="Ontario">Ontario</option>
                    <option value="Saskatchewan">Saskatchewan</option>
                    <option value="Alberta">Alberta</option>
                    <option value="Colombie-Britannique">Colombie-Britannique</option>
                    <option value="Yukon">Yukon</option>
                </select>
            </div>

            <div class="control-group">
                <label for="energy-var-select">Variable d'énergie</label>
                <select id="energy-var-select" class="form-control"></select>
            </div>

            <div class="control-group" id="counterpart-area-group" style="display: none;">
                <label for="counterpart-area-select">Zone de contrepartie</label>
                <select id="counterpart-area-select" class="form-control"></select>
            </div>

            <div class="control-group">
                <label for="start-date">Date de début</label>
                <div class="flatpickr-wrapper" id="start-date-wrapper">
                    <input type="text" id="start-date" class="flatpickr-input form-control" readonly data-input>
                    <i class="fa-regular fa-calendar-days flatpickr-icon"></i>
                </div>
            </div>

                <div class="control-group">
                <label for="end-date">Date de fin</label>
                <div class="flatpickr-wrapper" id="end-date-wrapper">
                    <input type="text" id="end-date" class="flatpickr-input form-control" readonly data-input>
                    <i class="fa-regular fa-calendar-days flatpickr-icon"></i>
                </div>
            </div>

            <div class="control-group">
                <button id="update-btn" class="btn btn-primary">
                    <i class="fa-solid fa-rotate"></i> Mettre à jour la période
                </button>
            </div>

            <div class="control-group">
                <button id="download-btn" class="btn btn-primary">
                    <i class="fa-solid fa-download"></i> Télécharger les données
                </button>
            </div>
        </div>

        <div class="wb-tabs">
            <div class="tabpanels">
                <div id="loading-spinner" class="spinner" style="display: none;"></div>
                <details id="chart-tab" open>
                    <summary>Graphique</summary>
                    <div id="chart-container"></div>
                </details>
                
                <details id="table-tab">
                    <summary>Tableau de données</summary>
                    <div id="table-container"></div>
                </details>
                
                <details id="api-tab">
                    <summary>IPA</summary>
                    <pre id="api-urls"></pre>
                </details>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
